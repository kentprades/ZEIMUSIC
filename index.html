<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="zmusic.png">
  <link rel="icon" type="image/png" sizes="32x32" href="zmusic.png">
  <link rel="icon" type="image/png" sizes="16x16" href="zmusic.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEIMUSIC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
   <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101018;
      color: #f7f5ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(119, 77, 255, 0.2), transparent 55%),
        #101018;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 56px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: rgba(25, 24, 37, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .note {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 13px;
      border: 1px solid rgba(177, 145, 255, 0.35);
      border-radius: 999px;
      color: #c9b6ff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 10vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    p {
      margin: 20px 0 32px;
      color: #b8b5c7;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #a98aff, #754dff);
      color: #fff;
      font-size: 1rem;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(117, 77, 255, 0.3);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(117, 77, 255, 0.42);
    }

    a:focus-visible {
      outline: 3px solid #d5c6ff;
      outline-offset: 4px;
    }

    .address {
      margin: 18px 0 0;
      font-size: 0.85rem;
    }

    .address a {
      min-height: auto;
      padding: 0;
      border-radius: 0;
      background: none;
      color: #c9b6ff;
      font-size: inherit;
      font-weight: 500;
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .address a:hover {
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main>
    <span class="note">A quick update</span>
    <h1>We've moved.</h1>
    <p>ZEIMUSIC has a new home. Visit our new website to keep listening and stay up to date.</p>
    <a href="https://zeimuzic.vercel.app/">Go to ZEIMUSIC</a>
  </main>
</body>
</html>
