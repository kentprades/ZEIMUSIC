<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="zmusic.png">
  <link rel="icon" type="image/png" sizes="32x32" href="zmusic.png">
  <link rel="icon" type="image/png" sizes="16x16" href="zmusic.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEIMUSIC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #121212, #181818);
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      margin-bottom: 160px; /* space for bottom bar */
    }
    .navbar { background-color: #000; }
    .player-box {
      background: rgba(24,24,24,0.9);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    h4 { color: #1db954; }
    .album-art {
      width: 60%; max-width: 300px;
      object-fit: cover; border-radius: 12px;
      margin-bottom: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .queue-item {
      display: flex; align-items: center;
      padding: 10px; border-bottom: 1px solid #333;
      cursor: pointer; transition: background 0.3s ease;
    }
    .queue-item:hover { background-color: rgba(29,185,84,0.2); }
    .queue-item img {
      width: 60px; height: 60px; object-fit: cover;
      border-radius: 10px; margin-right: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
    .queue-item.active { background-color: #1db954; color: #000; font-weight: bold; }

    .now-playing {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(24,24,24,0.95);
      padding: 10px 20px;
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between;
      border-top: 1px solid #333;
      backdrop-filter: blur(8px);
      gap: 10px;
    }
    .song-name {
      flex: 1 1 auto;
      display: flex; align-items: center;
      gap: 10px; min-width: 180px;
    }
    .song-art {
      width: 40px; height: 40px;
      object-fit: cover; border-radius: 6px;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    #current-song-name { font-size: 0.9rem; margin: 0; color: #fff; }

    .progress-container {
      flex: 2 1 100%; min-width: 200px;
    }
    .progress {
      width: 100%; height: 6px; background-color: #333;
      cursor: pointer; border-radius: 4px; overflow: hidden;
    }
    .progress-bar { height: 6px; background-color: #1db954; width: 0%; transition: width 0.2s linear; }
    .time { font-size: 0.8rem; color: #aaa; }

    .controls {
      flex: 1 1 auto; display: flex; justify-content: center;
    }
    .controls button {
      background: none; border: none; color: #fff;
      font-size: 1.5rem; margin: 0 10px; cursor: pointer;
      transition: color 0.3s ease;
    }
    .controls button:hover { color: #1db954; }
    .controls button.active { color: #1db954; }

    .extra-controls {
      flex: 1 1 auto; display: flex; justify-content: flex-end;
    }
    .volume-slider { width: 120px; }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .song-name { order: 1; justify-content: center; width: 100%; }
      .progress-container { order: 2; flex: 1 1 100%; }
      .controls { order: 3; justify-content: center; }
      .extra-controls { order: 4; justify-content: center; width: 100%; }
      .song-art { width: 30px; height: 30px; }
      #current-song-name { font-size: 0.8rem; text-align: center; }
      .volume-slider { width: 100%; max-width: 200px; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">ZEIMUSIC</span>
    </div>
  </nav>

  <!-- Main Player -->
  <div class="container">
    <div class="player-box text-center">
      <img id="current-art" src="covers/song1.jpg" alt="Album Art" class="album-art">
      <h4 id="current-title">Should I Try Now (By Shawn Kent)</h4>
      <p id="current-genre" class="text-muted">Taglish Emo Rap</p>

      <!-- Queue -->
      <h5 class="mt-4 text-start">Queue</h5>
      <div id="queue">
        <div class="queue-item" data-src="songs/song1.mp3" data-title="Should I Try Now (By Shawn Kent)" data-genre="Taglish Emo Rap" data-art="covers/song1.jpg">
          <img src="covers/song1.jpg" alt="Cover"> Should I Try Now (By Shawn Kent)
        </div>
        <div class="queue-item" data-src="songs/song2.mp3" data-title="Sure na Ba (By Shawn Kent)" data-genre="Reggae Slowed" data-art="covers/song2.jpg">
          <img src="covers/song2.jpg" alt="Cover"> Sure na Ba? (By Shawn Kent)
        </div>
        <div class="queue-item" data-src="songs/song3.mp3" data-title="System Crash (By Shawn Kent)" data-genre="Rock" data-art="covers/song3.jpg">
          <img src="covers/song3.jpg" alt="Cover"> System Crash (By Shawn Kent)
        </div>
        <div class="queue-item" data-src="songs/song4.mp3" data-title="I'll save you (By Shawn Kent)" data-genre="Lullaby Calm" data-art="covers/song4.jpg">
          <img src="covers/song4.jpg" alt="Cover"> I'll save you (By Shawn Kent)
        </div>
        <div class="queue-item" data-src="songs/song5.mp3" data-title="Kent is on the Paper (By Shawn Kent)" data-genre="Lullaby Calm" data-art="covers/song5.jpg">
          <img src="covers/song5.jpg" alt="Cover"> Kent is on the Paper (By Shawn Kent)
        </div>

      </div>
    </div>
  </div>

  <!-- Hidden audio element -->
  <audio id="audio-player"></audio>

  <!-- Custom bottom bar -->
  <div class="now-playing">
    <div class="song-name d-flex align-items-center">
      <img id="current-song-art" src="covers/song1.jpg" alt="Song Art" class="song-art">
      <h5 id="current-song-name">Should I Try Now (By Shawn Kent)</h5>
    </div>

    <div class="progress-container">
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <div class="d-flex justify-content-between">
        <span id="current-time" class="time">0:00</span>
        <span id="duration" class="time">0:00</span>
      </div>
      <div class="controls">
        <button id="prev"><div data-lucide="skip-back"></div></button>
        <button id="play"><div data-lucide="play"></div></button>
        <button id="next"><div data-lucide="skip-forward"></div></button>
        <button id="shuffle"><div data-lucide="shuffle"></div></button>
        <button id="repeat"><div data-lucide="repeat"></div></button>
      </div>
    </div>

    <div class="extra-controls">
      <div data-lucide="volume-2"></div>
      <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <script>
  const audioPlayer = document.getElementById('audio-player');
  const playBtn = document.getElementById('play');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const shuffleBtn = document.getElementById('shuffle');
  const repeatBtn = document.getElementById('repeat');
  const progressBar = document.getElementById('progress-bar');
  const progressContainer = document.querySelector('.progress');
  const currentTimeEl = document.getElementById('current-time');
  const durationEl = document.getElementById('duration');
  const queueItems = document.querySelectorAll('.queue-item');
  const volumeSlider = document.getElementById('volume');

  const currentArt = document.getElementById('current-art');
  const currentTitle = document.getElementById('current-title');
  const currentGenre = document.getElementById('current-genre');
  const currentSongArt = document.getElementById('current-song-art');
  const currentSongName = document.getElementById('current-song-name');

  let currentIndex = 0;
  let isShuffle = false;
  let isRepeat = false;

  function playSong(index) {
    const item = queueItems[index];
    audioPlayer.src = item.dataset.src;
    audioPlayer.play();
    currentIndex = index;

    // Update main player info
    currentArt.src = item.dataset.art;
    currentTitle.textContent = item.dataset.title;
    currentGenre.textContent = item.dataset.genre;

    // Update bottom bar song info
    currentSongArt.src = item.dataset.art;
    currentSongName.textContent = item.dataset.title;

    // Highlight active track
    queueItems.forEach(q => q.classList.remove('active'));
    item.classList.add('active');

    playBtn.innerHTML = '<div data-lucide="pause"></div>';
    lucide.createIcons();
  }

  playBtn.addEventListener('click', () => {
    if (audioPlayer.paused) {
      audioPlayer.play();
      playBtn.innerHTML = '<div data-lucide="pause"></div>';
    } else {
      audioPlayer.pause();
      playBtn.innerHTML = '<div data-lucide="play"></div>';
    }
    lucide.createIcons();
  });

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) playSong(currentIndex - 1);
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < queueItems.length - 1) playSong(currentIndex + 1);
  });

  // Shuffle toggle
  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
  });

  // Repeat toggle
  repeatBtn.addEventListener('click', () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('active', isRepeat);
  });

  audioPlayer.addEventListener('ended', () => {
    if (isRepeat) {
      playSong(currentIndex); // replay same track
    } else if (isShuffle) {
      const randomIndex = Math.floor(Math.random() * queueItems.length);
      playSong(randomIndex);
    } else if (currentIndex < queueItems.length - 1) {
      playSong(currentIndex + 1);
    } else {
      playBtn.innerHTML = '<div data-lucide="play"></div>';
      lucide.createIcons();
    }
  });

  audioPlayer.addEventListener('timeupdate', () => {
    const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
    progressBar.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
    durationEl.textContent = formatTime(audioPlayer.duration);
  });

  progressContainer.addEventListener('click', (e) => {
    const width = progressContainer.clientWidth;
    const clickX = e.offsetX;
    const duration = audioPlayer.duration;
    audioPlayer.currentTime = (clickX / width) * duration;
  });

  function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  queueItems.forEach((item, index) => {
    item.addEventListener('click', () => playSong(index));
  });

  // Volume control
  volumeSlider.addEventListener('input', () => {
    audioPlayer.volume = volumeSlider.value;
  });

  // Start with first song
  playSong(0);
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
